<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>ED ED - Claude Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">

        <!-- 返回連結 -->
        <a href="../index.html" class="text-blue-500 hover:underline mb-4 inline-block">← 返回 Dashboard</a>

        <!-- 標題區 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-xs bg-gray-200 px-2 py-1 rounded">美股</span>
                    
                    <h1 class="text-3xl font-bold mt-2">ED</h1>
                    <p class="text-gray-600 text-xl">ED</p>
                    
                    <p class="text-sm text-gray-500 mt-1"> · </p>
                </div>
                <div class="text-right">
                    <p class="text-3xl font-bold">$0.00</p>
                    <p class="text-green-500 text-xl">+0.00 (+0.00%)</p>
                </div>
            </div>
        </div>

        <!-- 價格走勢圖 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">價格走勢 (近3個月)</h2>
            <div id="price-chart" style="height: 300px;"></div>
        </div>

        <!-- 關鍵數據 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">關鍵數據</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">市值</p>
                    <p class="text-lg font-semibold">0</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">本益比 (P/E)</p>
                    <p class="text-lg font-semibold">0.00</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">每股盈餘 (EPS)</p>
                    <p class="text-lg font-semibold">$0.00</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">殖利率</p>
                    <p class="text-lg font-semibold">0.00%</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">52週最高</p>
                    <p class="text-lg font-semibold">$0.00</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">52週最低</p>
                    <p class="text-lg font-semibold">$0.00</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">成交量</p>
                    <p class="text-lg font-semibold">0</p>
                </div>
                <div class="p-3 bg-gray-50 rounded">
                    <p class="text-xs text-gray-500">平均成交量</p>
                    <p class="text-lg font-semibold">0</p>
                </div>
            </div>
        </div>

        <!-- 最新新聞 -->
        <div class="bg-white rounded-lg shadow mb-6">
            <h2 class="text-xl font-semibold p-6 pb-2">最新新聞</h2>
            <div class="divide-y">
                <p class="text-gray-500 p-4">暫無新聞</p>
            </div>
        </div>

        <!-- 公司簡介 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">公司簡介</h2>
            <p class="text-gray-700 text-sm leading-relaxed">暫無簡介</p>
            
        </div>

        <!-- 更新時間 -->
        <p class="text-center text-gray-400 text-sm">更新時間: 2026-11-08 22:28</p>

    </div>

    <script>
        var trace = {
            x: [],
            y: [],
            type: 'scatter',
            mode: 'lines',
            fill: 'tozeroy',
            line: {color: '#3b82f6', width: 2},
            fillcolor: 'rgba(59, 130, 246, 0.1)'
        };

        var layout = {
            margin: {l: 50, r: 20, t: 20, b: 40},
            xaxis: {showgrid: false},
            yaxis: {showgrid: true, gridcolor: '#eee'},
            hovermode: 'x unified'
        };

        Plotly.newPlot('price-chart', [trace], layout, {responsive: true});
    </script>
</body>
</html>
